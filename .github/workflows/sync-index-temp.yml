name: Sync generated standalone artifact

on:
  push:
    branches:
      - feature/pink-barcode-professional

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pink-barcode-professional

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone application
        run: npm run build

      - name: Commit generated index when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "index.html is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync standalone index"
          git push origin HEAD:feature/pink-barcode-professional
