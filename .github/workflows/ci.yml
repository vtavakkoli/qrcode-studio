name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run quality gate
        run: npm run check

      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: standalone-preview
          path: index.html
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated artifact is committed
        run: git diff --exit-code -- index.html
